<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css">
  <title>Welcome back</title>

</head>

<body>
<!-- mobile first -->
  <main>
    <div class="main-wrapper">
    <div class="hero"><img src="./imgs/image.png" alt="photo" class="mobile">
      <img src="./imgs/Login Art.png" alt="sasd" class="desktop">
    
    </div>
    
<div class="container">
  
      
        <div class="head-text">
      <h2>Welcome Back 👋</h2>
      <p id="subtext">Today is a new day. It's your day. You shape it. 
Sign in to start managing your projects.</p>
      
</div>
<section class="login">
      <form action="#" method="submit">
        <label for="Email">Email</label>
          <input type="email" name="email" id="email" placeholder="Example@email.com">
        
        <label for="Password">Password</label>
          <input type="password" name="password" id="password" placeholder="At least 8 characters">
        

        <a href="#" id="forgot-password">Forgot Password?</a>

        <button id="sign-in">Sign in</button>
        
</form>
<div class="other-sign-in">
        <span class="or">Or sign in with</span>

        <div class="btn">
        <button class="social-btn"><img src="./imgs/Google.svg" alt=""><span class="mobile-text">Google</span>
  <span class="desktop-text">Sign in with Google</span></button>
        <button class="social-btn"><img src="./imgs/Facebook.svg" alt=""><span class="mobile-text">Facebook</span>
  <span class="desktop-text">Sign in with Facebook</span></button>
</div>
        <p>Don't you have an Account?<a href="#"> Sign up</a></p>

        
    <p>&copy;2025 ALL RIGHTS RESERVED</p> 
 
</div>
       </div>
    </section>
   </div>
  </main>


 
</body>

</html>
